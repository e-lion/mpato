<!-- @dsCard group="Colors" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Hanken+Grotesk:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css">
<style>.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}.pm{border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 16px;display:flex;align-items:center;gap:14px;}.icn{width:44px;height:44px;border-radius:var(--r-md);display:grid;place-items:center;font-weight:800;font-size:18px;color:#fff;}.nm{font-weight:700;font-size:15px;}.sub{font-family:var(--font-mono);font-size:11px;color:var(--fg3);margin-top:2px;}.tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:var(--r-pill);margin-top:6px;display:inline-block;}</style>
</head><body>
<div class="cardhead"><span class="dot" style="background:var(--mpesa)"></span><span class="ttl">Payment methods</span></div>
<div class="grid">
  <div class="pm"><div class="icn" style="background:var(--mpesa)">M</div><div><div class="nm">M-PESA</div><div class="sub">--mpesa #18A558</div><span class="tag" style="background:var(--mpesa-bg);color:#0C744F">STK confirmed</span></div></div>
  <div class="pm"><div class="icn" style="background:var(--cash)">KSh</div><div><div class="nm">Cash</div><div class="sub">--cash #837C6E</div><span class="tag" style="background:var(--cash-bg);color:var(--fg2)">Drawer</span></div></div>
</div>
</body></html>
