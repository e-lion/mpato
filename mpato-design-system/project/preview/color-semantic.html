<!-- @dsCard group="Colors" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Hanken+Grotesk:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css">
<style>.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}.tile{border-radius:var(--r-md);border:1px solid var(--border);overflow:hidden;}.bar{height:42px;}.body{padding:8px 10px;}.nm{font-size:12px;font-weight:700;}.sub{font-family:var(--font-mono);font-size:10px;color:var(--fg3);margin-top:2px;}.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:var(--r-pill);margin-top:7px;}</style>
</head><body>
<div class="cardhead"><span class="dot" style="background:var(--danger)"></span><span class="ttl">Semantic · Status</span></div>
<div class="grid">
  <div class="tile"><div class="bar" style="background:var(--success)"></div><div class="body"><div class="nm">Success</div><div class="sub">#0F9061</div><span class="pill" style="background:var(--success-bg);color:var(--success-fg)">Paid</span></div></div>
  <div class="tile"><div class="bar" style="background:var(--warning)"></div><div class="body"><div class="nm">Warning</div><div class="sub">#E2A019</div><span class="pill" style="background:var(--warning-bg);color:var(--warning-fg)">Low stock</span></div></div>
  <div class="tile"><div class="bar" style="background:var(--danger)"></div><div class="body"><div class="nm">Danger</div><div class="sub">#E5544B</div><span class="pill" style="background:var(--danger-bg);color:var(--danger-fg)">Refunded</span></div></div>
  <div class="tile"><div class="bar" style="background:var(--info)"></div><div class="body"><div class="nm">Info</div><div class="sub">#5E6CE0</div><span class="pill" style="background:var(--info-bg);color:var(--info-fg)">New</span></div></div>
</div>
</body></html>
