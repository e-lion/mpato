<!-- @dsCard group="Components" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Hanken+Grotesk:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css">
<style>
.wrap{display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 11px;border-radius:var(--r-pill);}
.badge svg{width:13px;height:13px;}
.dot{width:7px;height:7px;border-radius:50%;}
</style>
</head><body>
<div class="cardhead"><span class="dot" style="background:var(--info)"></span><span class="ttl">Status badges</span></div>
<div class="wrap">
  <span class="badge" style="background:var(--success-bg);color:var(--success-fg)"><span class="dot" style="background:var(--success)"></span>Paid</span>
  <span class="badge" style="background:var(--warning-bg);color:var(--warning-fg)"><span class="dot" style="background:var(--warning)"></span>Low stock</span>
  <span class="badge" style="background:var(--danger-bg);color:var(--danger-fg)"><span class="dot" style="background:var(--danger)"></span>Out of stock</span>
  <span class="badge" style="background:var(--info-bg);color:var(--info-fg)">New</span>
  <span class="badge" style="background:var(--mpesa-bg);color:#0C744F"><i data-lucide="smartphone"></i>M-PESA</span>
  <span class="badge" style="background:var(--cash-bg);color:var(--fg2)"><i data-lucide="banknote"></i>Cash</span>
  <span class="badge" style="background:var(--rose-500);color:#fff">Pro plan</span>
  <span class="badge" style="background:var(--stone-100);color:var(--fg2)">Draft</span>
</div>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script><script>lucide.createIcons();</script>
</body></html>
