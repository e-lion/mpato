<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Hanken+Grotesk:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css">
<style>
.row{display:flex;align-items:center;gap:34px;flex-wrap:wrap;}
.lock{display:flex;align-items:center;gap:12px;}
.word{font-family:var(--font-display);font-weight:800;font-size:30px;letter-spacing:-1.6px;color:var(--fg1);}
.dark{background:var(--stone-900);border-radius:var(--r-lg);padding:16px 22px;display:flex;align-items:center;gap:12px;}
.dark .word{color:#fff;}
.sizes{display:flex;align-items:center;gap:16px;}
.cap{font-size:11px;color:var(--fg3);font-weight:600;margin-top:8px;}
</style>
</head><body>
<div class="cardhead"><span class="dot" style="background:var(--rose-500)"></span><span class="ttl">Logo — mark, lockup &amp; sizes</span></div>
<div class="row">
  <div class="lock"><img src="../assets/logomark.svg" width="46" height="46"><span class="word">Mpato</span></div>
  <div class="dark"><img src="../assets/logomark.svg" width="40" height="40"><span class="word">Mpato</span></div>
  <div class="sizes">
    <img src="../assets/logomark.svg" width="44" height="44">
    <img src="../assets/logomark.svg" width="30" height="30">
    <img src="../assets/logomark.svg" width="20" height="20">
  </div>
</div>
<div class="cap">Clearspace ≥ the mark's corner radius · min 20px mark / 110px lockup · never recolor or stretch</div>
</body></html>
