<!-- @dsCard group="Spacing" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Hanken+Grotesk:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css">
<style>.scale{display:flex;align-items:center;gap:26px;flex-wrap:wrap;padding:6px 4px 10px;}.r{display:flex;flex-direction:column;align-items:center;gap:11px;}.box{width:84px;height:64px;background:var(--white);border-radius:var(--r-lg);border:1px solid var(--border);}.nm{font-size:12px;font-weight:700;}.num{font-family:var(--font-mono);font-size:10px;color:var(--fg3);}</style>
</head><body>
<div class="cardhead"><span class="dot" style="background:var(--stone-300)"></span><span class="ttl">Elevation — soft, warm-tinted</span></div>
<div class="scale" id="s"></div>
<script>
const r=[['xs','var(--shadow-xs)'],['sm','var(--shadow-sm)'],['md','var(--shadow-md)'],['lg','var(--shadow-lg)'],['xl','var(--shadow-xl)']];
document.getElementById('s').innerHTML=r.map(([k,v])=>`<div class="r"><div class="box" style="box-shadow:${v}"></div><div class="nm">${k}</div></div>`).join('');
</script>
</body></html>
